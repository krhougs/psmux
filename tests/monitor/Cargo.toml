[workspace]

[package]
name = "psmux-test-monitor"
version = "0.1.0"
edition = "2021"
description = "Realtime mouse-driven TUI monitor for psmux test runs (tests/run_all_tests.ps1)"
publish = false

[[bin]]
name = "psmux-test-monitor"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
